<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>האזנה וסימון</title>
<style>
/* Layout: a generic review: header (title, intro, legend of mark colours), then one card per item: spectrogram with mark strips, normal and half-speed playback, the review's answers. */
:root{
  --bg:#f3f5f4; --card:#ffffff; --ink:#1d282c; --muted:#5d6b70; --rule:#d9e0de; --accent:#0b7a75; --accent-soft:#e1f0ee;
  --ok:#2e7d32; --bad:#c62828;
  --font:"Assistant","Arial Hebrew",Arial,sans-serif; --mono:ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121819;--card:#1a2224;--ink:#e2eae8;--muted:#9aaeb0;--rule:#2b3739;--accent:#4fc1b8;--accent-soft:#163030;
        --ok:#7cc47f;--bad:#ef7b7b;color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
header{background:var(--card);border-bottom:1px solid var(--rule);padding:10px max(16px,2vw);display:flex;flex-direction:column;gap:6px}
h1{margin:0;font-size:1.25rem}
.sum{color:var(--muted);font-size:.9rem;max-width:72rem}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:8px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}
main{padding:14px max(16px,2vw);display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px;max-width:1500px;margin:0 auto}
.c{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.c img{width:100%;display:block;border-radius:4px;background:var(--bg)}
.play{display:flex;gap:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:5px;padding:2px 9px;font-size:.82rem}
.verdicts{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.verdicts button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.verdicts input{flex:1;min-width:8rem;font:inherit;font-size:.8rem;padding:2px 6px;border:1px solid var(--rule);border-radius:5px;background:var(--bg);color:var(--ink)}
.saved{font-size:.72rem;color:var(--ok)}
.done{font-size:.85rem;color:var(--muted)}
.empty{color:var(--muted);padding:30px;text-align:center;grid-column:1/-1}
code{font-family:var(--mono);font-size:.8em;direction:ltr;unicode-bidi:isolate}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1 id="title">טוען…</h1>
  <div class="sum" id="intro"></div>
  <div class="legend" id="legend"></div>
  <div class="done" id="done"></div>
</header>
<main id="list"><div class="empty">טוען…</div></main>
<script>
const T = new URLSearchParams(location.search).get("t") || "";
const api = (p, q = {}) => `${p}?${new URLSearchParams({...q, t: T})}`;
const $ = id => document.getElementById(id);
let rows = [], player = null, OPTIONS = [];
const SKIP = new Set(["item_id", "marks", "feedback"]);

function play(src, rate){
  if (player) player.pause();
  player = new Audio(src);
  player.preservesPitch = false; player.mozPreservesPitch = false; player.webkitPreservesPitch = false;
  player.playbackRate = rate;
  player.play();
}
function progress(){
  const n = rows.filter(r => r.feedback && r.feedback.verdict).length;
  $("done").textContent = `סומנו ${n} מתוך ${rows.length}`;
}
function card(r){
  const el = document.createElement("article"); el.className = "c";
  const info = Object.entries(r).filter(([k]) => !SKIP.has(k)).map(([k, v]) => `<span dir="ltr">${k}: <b>${v}</b></span>`).join("");
  el.innerHTML = `
    <div class="meta"><code>${r.item_id}</code>${info}</div>
    <img loading="lazy" alt="ספקטרוגרמה של ${r.item_id}" src="${api(`api/review_spec/${r.item_id}`)}">
    <div class="play"><button type="button" data-r="1">▶ מהירות רגילה</button><button type="button" data-r="0.5">▶ חצי מהירות</button></div>
    <div class="verdicts">${OPTIONS.map(([v, l]) => `<button type="button" data-v="${v}">${l}</button>`).join("")}
      <input placeholder="הערה"><span class="saved"></span></div>`;
  const src = api(`api/review_audio/${r.item_id}`);
  el.querySelectorAll(".play button").forEach(b => b.onclick = () => play(src, +b.dataset.r));
  const btns = el.querySelectorAll(".verdicts button"), note = el.querySelector(".verdicts input"), saved = el.querySelector(".saved");
  note.value = r.feedback && r.feedback.note || "";
  let cur = r.feedback ? r.feedback.verdict : null;
  const paint = () => btns.forEach(b => b.classList.toggle("on", b.dataset.v === cur));
  const save = async () => {
    const res = await fetch(api("api/review_feedback"), {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({item_id: r.item_id, verdict: cur, note: note.value})});
    r.feedback = {verdict: cur, note: note.value};
    saved.textContent = res.ok ? "נשמר" : "השמירה נכשלה: בדוק שהשרת עדיין רץ";
    setTimeout(() => saved.textContent = "", 1500);
    progress();
  };
  btns.forEach(b => b.onclick = () => { cur = cur === b.dataset.v ? null : b.dataset.v; paint(); save(); });
  note.onchange = save;
  paint();
  return el;
}
fetch(api("api/review")).then(r => r.json()).then(d => {
  rows = d.rows; OPTIONS = d.options;
  document.title = d.title; $("title").textContent = d.title; $("intro").textContent = d.intro;
  const names = {label: "תיוג ידני", a: (d.models || [])[0] || "a", b: (d.models || [])[1] || "b"};
  $("legend").innerHTML = Object.entries(d.colors).map(([k, c]) => `<span><i style="background:${c}"></i>${names[k] || k}</span>`).join("");
  $("list").innerHTML = "";
  if (!rows.length) $("list").innerHTML = `<div class="empty">אין פריטים.</div>`;
  for (const r of rows) $("list").appendChild(card(r));
  progress();
}).catch(() => { $("list").innerHTML = `<div class="empty">אין גישה לרשימה. פתח את הכתובת שהשרת הדפיס, עם <code>?t=…</code>, ובדוק שהשרת הופעל עם <code>--review</code>.</div>`; });
</script>
</body>
</html>
