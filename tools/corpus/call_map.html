<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מפת הקריאות</title>
<style>
/* Layout: the map (canvas) beside a panel with the clicked call and the list of clusters. */
:root{
  --bg:#f3f5f4; --card:#ffffff; --ink:#1d282c; --muted:#5d6b70; --rule:#d9e0de; --accent:#0b7a75; --accent-soft:#e1f0ee;
  --map:#fbfcfc; --noise:#b9c2c0;
  --font:"Assistant","Arial Hebrew",Arial,sans-serif; --mono:ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121819;--card:#1a2224;--ink:#e2eae8;--muted:#9aaeb0;--rule:#2b3739;--accent:#4fc1b8;--accent-soft:#163030;
        --map:#0e1314;--noise:#3d4a4c;color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
header{background:var(--card);border-bottom:1px solid var(--rule);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
h1{margin:0;font-size:1.2rem}
.sum{color:var(--muted);font-size:.88rem}
header label{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center}
select,input,button{font:inherit;font-size:.88rem;border:1px solid var(--rule);border-radius:5px;background:var(--bg);color:var(--ink);padding:3px 8px}
button{cursor:pointer}
a{color:var(--accent)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;padding:12px 16px;height:calc(100vh - 56px)}
#mapbox{position:relative;background:var(--map);border:1px solid var(--rule);border-radius:8px;overflow:hidden;min-height:320px}
canvas#map{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
#legend{position:absolute;bottom:8px;inset-inline-start:8px;background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:4px 8px;font-size:.75rem;color:var(--muted)}
#hint{position:absolute;top:8px;inset-inline-start:8px;font-size:.75rem;color:var(--muted);background:var(--card);border-radius:6px;padding:2px 8px;border:1px solid var(--rule)}
aside{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.card h2{margin:0 0 6px;font-size:.95rem}
.meta{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:2px 12px}
.meta b{color:var(--ink)}
#sel img{width:100%;aspect-ratio:2.2/1;border-radius:4px;background:var(--bg);display:block;margin:6px 0}
#sel audio{width:100%;height:32px}
.cl{display:grid;grid-template-columns:14px 64px 1fr;gap:6px 8px;align-items:center;padding:6px 4px;border-top:1px solid var(--rule);cursor:pointer}
.cl:first-of-type{border-top:0}
.cl.on{background:var(--accent-soft);border-radius:6px}
.sw{width:12px;height:12px;border-radius:3px}
.cl canvas{width:64px;height:40px;border-radius:3px;image-rendering:pixelated}
.cl .info{display:flex;flex-direction:column;gap:2px;min-width:0}
.cl .info span{font-size:.75rem;color:var(--muted)}
.cl input{width:100%;font-size:.82rem;padding:1px 6px}
.cl button{font-size:.75rem;padding:1px 6px}
.row{display:flex;gap:6px;align-items:center}
@media (max-width:860px){.wrap{grid-template-columns:1fr;height:auto}#mapbox{height:70vh}}
</style>
</head>
<body>
<header>
  <h1>מפת הקריאות</h1>
  <span class="sum" id="sum">טוען…</span>
  <label>צבע לפי<select id="color">
    <option value="cluster">אשכול</option><option value="duration">משך</option><option value="peak">תדר שיא</option>
    <option value="snr">SNR</option><option value="hour">שעה</option><option value="date">תאריך</option></select></label>
  <label><input type="checkbox" id="hideNoise"> הסתר לא משויכים</label>
  <button id="reset">איפוס תצוגה</button>
  <a id="libLink" href="#">← ספריית הקריאות</a>
</header>
<div class="wrap">
  <div id="mapbox"><canvas id="map"></canvas><div id="hint">לחיצה = השמעה · גלגלת = זום · גרירה = הזזה</div><div id="legend"></div></div>
  <aside>
    <div class="card" id="sel"><h2>קריאה נבחרת</h2><div class="meta">לחץ על נקודה במפה</div></div>
    <div class="card"><h2>אשכולות</h2><div class="sum" style="margin-bottom:4px">התמונה היא הספקטרוגרם הממוצע (2–20 kHz, זמן מנורמל). שמות נשמרים בשרת.</div><div id="clusters"></div></div>
  </aside>
</div>
<script>
const T = new URLSearchParams(location.search).get("t") || "";
const api = (p, q = {}) => `${p}?${new URLSearchParams({t: T, ...q})}`;
const $ = id => document.getElementById(id);
$("libLink").href = api("./");
let M, P = [], names = {}, view = {s: 1, x: 0, y: 0}, selected = null, focus = null, saveTimer = null;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const hue = c => `hsl(${(c * 137.508) % 360} 62% 50%)`;
const seq = t => `hsl(${250 - 250 * Math.max(0, Math.min(1, t))} 70% 48%)`;

async function load() {
  const r = await fetch(api("api/map"));
  if (!r.ok) { $("sum").textContent = "אין עדיין מפה (map.json) לריצה הזו"; return; }
  M = await r.json();
  names = await (await fetch(api("api/map_names"))).json();
  const F = M.meta.fields;
  P = M.points.map(a => Object.fromEntries(F.map((f, i) => [f, a[i]])));
  const dates = [...new Set(P.map(p => p.date))].sort();
  P.forEach(p => { p.di = dates.indexOf(p.date) / Math.max(1, dates.length - 1); });
  const xs = P.map(p => p.x), ys = P.map(p => p.y);
  M.box = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const nc = M.clusters.filter(c => c.id >= 0).length, noise = (M.clusters.find(c => c.id < 0) || {n: 0}).n;
  $("sum").textContent = `${P.length.toLocaleString()} קריאות · ${nc} אשכולות · ${noise.toLocaleString()} לא משויכות · ${M.meta.version === "clean" ? "שמע מנוקה" : "שמע מקורי"}`;
  renderClusters(); draw();
}

function colour(p) {
  const mode = $("color").value;
  if (mode === "cluster") return p.cluster < 0 ? css("--noise") : hue(p.cluster);
  if (mode === "duration") return seq((Math.log10(p.duration_s) + 1) / 2);   // 0.1 .. 10 s
  if (mode === "peak") return seq(((p.peak_freq_hz ?? 0) - 4000) / 12000);  // 4 .. 16 kHz
  if (mode === "snr") return seq(((p.snr_db ?? 0) - 5) / 35);               // 5 .. 40 dB
  if (mode === "hour") return `hsl(${p.hour * 15} 65% 50%)`;
  return seq(p.di);
}
function legend() {
  const mode = $("color").value;
  $("legend").textContent = {cluster: "צבע = אשכול (אפור = לא משויך)", duration: "כחול 0.1 s → אדום 10 s (לוג)",
    peak: "כחול 4 kHz → אדום 16 kHz", snr: "כחול 5 dB → אדום 40 dB", hour: "גוון לפי שעה ביממה",
    date: "כחול = מאי 2021 → אדום = אוקטובר 2021"}[mode];
}

const cv = $("map"), ctx = cv.getContext("2d");
function toPx(p) {
  const [x0, x1, y0, y1] = M.box, w = cv.width, h = cv.height, pad = 20 * devicePixelRatio;
  const k = Math.min((w - 2 * pad) / (x1 - x0), (h - 2 * pad) / (y1 - y0)) * view.s;
  return [w / 2 + ((p.x - (x0 + x1) / 2) * k) + view.x, h / 2 - ((p.y - (y0 + y1) / 2) * k) + view.y];
}
function draw() {
  if (!M) return;
  const r = cv.getBoundingClientRect();
  cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio;
  ctx.fillStyle = css("--map"); ctx.fillRect(0, 0, cv.width, cv.height);
  const rad = Math.max(1, 1.6 * devicePixelRatio * Math.sqrt(view.s));
  const hide = $("hideNoise").checked;
  for (const pass of [0, 1]) for (const p of P) {
    if (hide && p.cluster < 0) continue;
    const isFocus = focus !== null && p.cluster === focus;
    if ((pass === 1) !== isFocus) continue;   // the focused cluster is drawn last, on top
    const [x, y] = toPx(p);
    ctx.globalAlpha = focus !== null && !isFocus ? 0.15 : 0.75;
    ctx.fillStyle = colour(p); ctx.fillRect(x - rad / 2, y - rad / 2, rad, rad);
  }
  ctx.globalAlpha = 1;
  if (selected) {
    const [x, y] = toPx(selected);
    ctx.strokeStyle = css("--ink"); ctx.lineWidth = 2 * devicePixelRatio;
    ctx.beginPath(); ctx.arc(x, y, 7 * devicePixelRatio, 0, 7); ctx.stroke();
  }
  legend();
}

function nearest(ev) {
  const r = cv.getBoundingClientRect(), mx = (ev.clientX - r.left) * devicePixelRatio, my = (ev.clientY - r.top) * devicePixelRatio;
  let best = null, bd = (12 * devicePixelRatio) ** 2;
  for (const p of P) {
    if ($("hideNoise").checked && p.cluster < 0) continue;
    const [x, y] = toPx(p), d = (x - mx) ** 2 + (y - my) ** 2;
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}
function show(p, autoplay = true) {
  selected = p; draw();
  const nm = p.cluster >= 0 ? (names[p.cluster] || `אשכול ${p.cluster}`) : "לא משויך";
  $("sel").innerHTML = `<h2>קריאה נבחרת · ${nm}</h2>
    <div class="meta"><span><b>${p.date}</b> ${String(p.hour).padStart(2, "0")}:00</span><span>משך <b>${p.duration_s.toFixed(2)}</b> s</span>
    <span>תדר שיא <b>${p.peak_freq_hz != null ? (p.peak_freq_hz / 1000).toFixed(1) : "–"}</b> kHz</span><span>SNR <b>${p.snr_db ?? "–"}</b> dB</span></div>
    <img alt="ספקטרוגרמה" src="${api(`api/spec/${p.call_id}`, {v: "orig"})}">
    <audio controls ${autoplay ? "autoplay" : ""} src="${api(`api/audio/${p.call_id}`, {v: "orig"})}"></audio>
    <div class="meta"><code>${p.call_id}</code></div>`;
}

function renderClusters() {
  const box = $("clusters"); box.innerHTML = "";
  const cl = [...M.clusters].sort((a, b) => (a.id < 0) - (b.id < 0) || b.n - a.n);
  for (const c of cl) {
    const div = document.createElement("div");
    div.className = "cl" + (focus === c.id ? " on" : "");
    div.innerHTML = `<span class="sw" style="background:${c.id < 0 ? css("--noise") : hue(c.id)}"></span><canvas width="${M.meta.n_steps}" height="${M.meta.n_bands}"></canvas>
      <div class="info">${c.id < 0 ? `<b>לא משויך</b>` : `<input placeholder="אשכול ${c.id}: תן שם" value="${(names[c.id] || "").replace(/"/g, "&quot;")}">`}
      <div class="row"><span>${c.n.toLocaleString()} קריאות · חציון ${c.median_dur_s.toFixed(2)} s</span><button>▶ דוגמה</button></div></div>`;
    const g = div.querySelector("canvas").getContext("2d"), img = g.createImageData(M.meta.n_steps, M.meta.n_bands);
    c.mean_image.forEach((row, b) => row.forEach((v, t) => {   // row 0 = lowest band -> bottom
      const i = ((M.meta.n_bands - 1 - b) * M.meta.n_steps + t) * 4, u = Math.max(0, Math.min(1, v));
      img.data[i] = 255 * Math.min(1, 1.6 * u); img.data[i + 1] = 255 * Math.max(0, 1.8 * u - 0.8); img.data[i + 2] = 255 * (0.35 + 0.4 * u - 0.6 * u * u); img.data[i + 3] = 255;
    }));
    g.putImageData(img, 0, 0);
    div.onclick = e => { if (e.target.tagName === "INPUT") return; if (e.target.tagName === "BUTTON") { const ms = P.filter(p => p.cluster === c.id); show(ms[Math.floor(Math.random() * ms.length)]); return; }
      focus = focus === c.id ? null : c.id; renderClusters(); draw(); };
    const inp = div.querySelector("input");
    if (inp) inp.oninput = () => { names[c.id] = inp.value; if (!inp.value) delete names[c.id];
      clearTimeout(saveTimer); saveTimer = setTimeout(() => fetch(api("api/map_names"), {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(names)}), 600); };
    box.appendChild(div);
  }
}

let drag = null;
cv.addEventListener("pointerdown", e => { drag = {x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true; view.x = drag.vx + dx * devicePixelRatio; view.y = drag.vy + dy * devicePixelRatio; if (drag.moved) draw(); });
cv.addEventListener("pointerup", e => { const d = drag; drag = null; if (d && !d.moved) { const p = nearest(e); if (p) show(p); } });
cv.addEventListener("wheel", e => { e.preventDefault(); const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left) * devicePixelRatio - cv.width / 2, my = (e.clientY - r.top) * devicePixelRatio - cv.height / 2;
  const f = Math.exp(-e.deltaY * 0.0015), s = Math.max(0.5, Math.min(60, view.s * f)), k = s / view.s;
  view.x = mx - (mx - view.x) * k; view.y = my - (my - view.y) * k; view.s = s; draw(); }, {passive: false});
$("color").onchange = draw; $("hideNoise").onchange = draw;
$("reset").onclick = () => { view = {s: 1, x: 0, y: 0}; focus = null; renderClusters(); draw(); };
window.addEventListener("resize", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { renderClusters(); draw(); });
load();
</script>
</body>
</html>
